<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07130f">
  <meta name="description" content="Football Spotlight — scores, résultats et actualités du football mondial.">
  <title>FOOTBALL SPOTLIGHT</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="hero">
    <div class="brand-mark">⚽</div>
    <div>
      <p class="eyebrow">LE FOOTBALL, EN DIRECT</p>
      <h1>FOOTBALL <span>SPOTLIGHT</span></h1>
      <p class="subtitle">Le monde du football au même endroit.</p>
    </div>
  </header>

  <main>
    <section class="toolbar">
      <div>
        <p class="eyebrow">CENTRE DU MATCH</p>
        <h2>Scores & résultats</h2>
      </div>
      <div class="status"><span class="pulse"></span> Données actualisées automatiquement</div>
    </section>

    <section class="filters" aria-label="Filtres">
      <button class="filter active" data-filter="all">Tous</button>
      <button class="filter" data-filter="live">En direct</button>
      <button class="filter" data-filter="finished">Terminés</button>
      <button class="filter" data-filter="scheduled">À venir</button>
    </section>

    <section id="summary" class="summary-grid">
      <article class="summary-card"><span>Matchs</span><strong id="total">—</strong></article>
      <article class="summary-card"><span>En direct</span><strong id="live-count">—</strong></article>
      <article class="summary-card"><span>Terminés</span><strong id="finished-count">—</strong></article>
    </section>

    <section id="matches" class="matches-grid" aria-live="polite">
      <div class="loading">Chargement des rencontres…</div>
    </section>

    <p class="updated" id="updated"></p>
  </main>

  <footer>
    <strong>FOOTBALL SPOTLIGHT</strong>
    <span>Les données de matchs sont fournies par API-Football.</span>
  </footer>
  <script src="script.js"></script>
</body>
</html>
